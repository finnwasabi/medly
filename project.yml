name: NersDaily
options:
  bundleIdPrefix: io.github.finnwasabi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  NersCore:
    path: Packages/NersCore
targets:
  NersDaily:
    type: application
    platform: iOS
    dependencies:
      - package: NersCore
      - target: NersDailyWidget
    sources:
      - App/Sources
      - App/Shared
      - App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Ner's Daily"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [vi, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: "Ner's Daily sets alarms to remind you to take your pill on time, even when your phone is on silent."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.finnwasabi.nersdaily
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NersDailyWidget:
    type: app-extension
    platform: iOS
    sources:
      - App/Widget
      - App/Shared
    info:
      path: App/Widget/Info.plist
      properties:
        CFBundleDisplayName: "Ner's Daily"
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.finnwasabi.nersdaily.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  NersDaily:
    build:
      targets:
        NersDaily: all
