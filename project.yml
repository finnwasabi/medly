name: Medly
options:
  bundleIdPrefix: io.github.finnwasabi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  MedlyCore:
    path: Packages/MedlyCore
targets:
  Medly:
    type: application
    platform: iOS
    dependencies:
      - package: MedlyCore
      - target: MedlyWidget
    sources:
      - App/Sources
      - App/Shared
      - App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Medly"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [vi, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: "Medly sets alarms to remind you to take your medication on time, even when your phone is on silent."
    entitlements:
      path: App/Medly.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.finnwasabi.nersdaily]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.finnwasabi.nersdaily
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MedlyWidget:
    type: app-extension
    platform: iOS
    dependencies:
      - package: MedlyCore
    entitlements:
      path: App/Widget/MedlyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.finnwasabi.nersdaily]
    sources:
      - App/Widget
      - App/Shared
    info:
      path: App/Widget/Info.plist
      properties:
        CFBundleDisplayName: "Medly"
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.finnwasabi.nersdaily.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Medly:
    build:
      targets:
        Medly: all
