name: Pillot
options:
  bundleIdPrefix: io.github.finnwasabi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  PillotCore:
    path: Packages/PillotCore
targets:
  Pillot:
    type: application
    platform: iOS
    dependencies:
      - package: PillotCore
      - target: PillotWidget
    sources:
      - App/Sources
      - App/Shared
      - App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Pillot"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [vi, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: "Pillot sets alarms to remind you to take your medication on time, even when your phone is on silent."
        # Background refresh tops the alarms up when the app is not opened for days.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.github.finnwasabi.nersdaily.refresh]
    entitlements:
      path: App/Pillot.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.finnwasabi.nersdaily]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.finnwasabi.nersdaily
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PillotWidget:
    type: app-extension
    platform: iOS
    dependencies:
      - package: PillotCore
    entitlements:
      path: App/Widget/PillotWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.finnwasabi.nersdaily]
    sources:
      - App/Widget
      - App/Shared
    info:
      path: App/Widget/Info.plist
      properties:
        CFBundleDisplayName: "Pillot"
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.finnwasabi.nersdaily.widget
        TARGETED_DEVICE_FAMILY: "1"
        # MarkTakenIntent is shared; its work only exists in the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Pillot:
    build:
      targets:
        Pillot: all
