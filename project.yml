name: NersDaily
options:
  bundleIdPrefix: io.github.finnwasabi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  NersDaily:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Ner's Daily"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAlarmKitUsageDescription: "Ner's Daily cần đặt báo thức để nhắc bạn uống thuốc đúng giờ, kể cả khi máy đang im lặng."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.finnwasabi.nersdaily
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  NersDaily:
    build:
      targets:
        NersDaily: all
