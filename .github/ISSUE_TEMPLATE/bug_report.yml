name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include real health data or personal information. Security issues go to Security > Report a vulnerability instead."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Set pill time to 21:00\n2. Change the phone's time zone to Asia/Tokyo\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings > App > Version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 17 Pro, iOS 27.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Alarms and notifications, Schedule or time zones, History, Pill counting, Sync and bot, Install or update, Other]
