# Tagging vX.Y.Z builds an unsigned .ipa and attaches it, with source.json, to a GitHub Release.
# SideStore reads the fixed source: https://github.com/finnwasabi/pillot/releases/latest/download/source.json
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Fails fast when the tag is not the tip of main, misses commits from develop or has no changelog section,
  # before any macOS minutes are spent and before anything is published.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone -q "https://github.com/$GITHUB_REPOSITORY" . && git checkout -q "$GITHUB_REF_NAME"
      - name: Check the tag
        run: scripts/check-release.sh "$GITHUB_REF_NAME"

  ipa:
    needs: verify
    runs-on: macos-26
    steps:
      - name: Checkout
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY" .
      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: |
          swift test --package-path Packages/PillotCore
          (cd server && node --test)
      - name: Build ipa
        run: VERSION="${GITHUB_REF_NAME#v}" BUILD="$GITHUB_RUN_NUMBER" scripts/build-ipa.sh
      - name: Make source.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Pillot-$VERSION.ipa"
          python3 scripts/make-source.py "build/Pillot-$VERSION.ipa" "$VERSION" "$GITHUB_RUN_NUMBER" "$URL" "$(date -u +%F)" > build/source.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Pillot-${GITHUB_REF_NAME#v}.ipa" build/source.json \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
