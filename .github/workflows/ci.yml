# Chạy test logic (NersCore) và test server cho mỗi PR và mỗi lần đẩy lên main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Checkout
        run: |
          git init -q . && git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: NersCore
        run: swift test --package-path Packages/NersCore
      - name: Server
        run: cd server && node --test
      - name: Build ipa
        run: |
          xcodebuild -version
          brew install xcodegen
          scripts/build-ipa.sh
