# Runs the MedlyCore tests, the server tests and an .ipa build for every PR and every push to main or develop.
# The job name `test` is the required status check in the branch rulesets; rename both together.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Checkout
        run: |
          git init -q . && git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: MedlyCore
        run: swift test --package-path Packages/MedlyCore
      - name: Server
        run: cd server && node --test
      - name: Build ipa
        run: |
          xcodebuild -version
          brew install xcodegen
          scripts/build-ipa.sh
